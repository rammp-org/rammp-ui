; Defaults for the Jetson (LinuxArm64) package. They are DEFAULTS: the device's own Saved
; GameUserSettings.ini overrides them (Development: <package>/RammpUI/Saved/Config/LinuxArm64/;
; Shipping: ~/.config/Epic/RammpUI/Saved/Config/LinuxArm64/), and the app rewrites that file on exit
; with every value that differs from this one. So a device that ran an older build keeps its old
; frame limit and scalability until those lines are removed from it, with the app stopped
; (README: Linux ARM64, On the device).

[/Script/Engine.GameUserSettings]
; The frame cap. It must be set here, not as t.MaxFPS in an Engine ini: at startup
; UGameEngine::Init applies FrameRateLimit through UEngine::SetMaxFPS at the same priority as
; whatever set t.MaxFPS before, so the default FrameRateLimit=0 undoes any ini t.MaxFPS.
; Measured on UE 5.8: t.MaxFPS=30 from [ConsoleVariables] read 0 (uncapped) once the game was up;
; FrameRateLimit=24 read 24.
FrameRateLimit=24.000000

[ScalabilityGroups]
; Epic (3) in every group is too heavy for the Orin; these five go to Medium (1). GI 1 keeps Lumen
; GI on with its cheaper irradiance-volume gather; reflections 1 turns Lumen reflections off and uses
; screen-space reflections. The other groups stay at Epic. Low is 0, if the Orin needs more headroom.
sg.GlobalIlluminationQuality=1
sg.ShadowQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=1
sg.AntiAliasingQuality=1
