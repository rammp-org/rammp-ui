[ConsoleVariables]
; UE 5.8 starts dynamic rendering when the driver has VK_KHR_dynamic_rendering, then calls
; vkCmdSetRenderingInputAttachmentIndicesKHR (VK_KHR_dynamic_rendering_local_read) unchecked. The
; Jetson Orin's driver (540.4.0, Vulkan 1.3.251) lacks local read, so that pointer is null and the
; RHI thread crashes at the first render pass. Classic render passes avoid it.
r.Vulkan.AllowDynamicRendering=0
; Leave the Jetson's GPU and CPU some headroom.
t.MaxFPS=60
