; Start UE's Model Context Protocol server with the editor, so MCP clients can
; drive this project (capture the PIE viewport, inspect actors) without anyone
; first running `ModelContextProtocol.StartServer` by hand.
;
; The port and path must match whatever .mcp.json a client reads; 8000 and /mcp
; are what the RAMMS projects standardise on. Change either and regenerate the
; client config from the editor console, or clients keep dialling the old
; endpoint and fail to connect while the server is running:
;
;   ModelContextProtocol.GenerateClientConfig ClaudeCode
;
; These are defaults, not locks: Edit > Editor Preferences > General > Model
; Context Protocol overrides them per user, into the untracked
; Saved/Config/<Platform>/EditorPerProjectUserSettings.ini. The server only runs
; while the editor is open. Requires the ModelContextProtocol plugin to be
; enabled in RammpUI.uproject.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8000
bAutoStartServer=True
bEnableToolSearch=True
