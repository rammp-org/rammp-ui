[/Script/RemoteControlCommon.RemoteControlSettings]
; Remote Control refuses remote function calls that aren't listed here unless bAllowAnyRemoteFunctionCall is on.
; In the editor that is a per-user setting (Saved/Config), so a package gets the default and refused every call
; RCP_RammsBridge exposes. Allow just the bridge receiver's functions: Web Remote Control listens on every interface
; without authentication, so allowing any call would let anyone on the network call any function.
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsBridgeReceiver",FunctionName=("UpdatePanel"),bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsBridgeReceiver",FunctionName=("UpdateDetectedObjects"),bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsBridgeReceiver",FunctionName=("UpdateWorldState"),bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsBridgeReceiver",FunctionName=("OpenCameraFeed"),bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsBridgeReceiver",FunctionName=("CloseCameraFeed"),bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsBridgeReceiver",FunctionName=("PollUIEvents"),bAllowChildClasses=False)
